<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificador Bayes Ingenuo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="panel">
  <h1>Clasificador Bayes Ingenuo</h1>

  <label>Cargar dataset (CSV): <input type="file" id="dataset" accept=".csv,.txt"></label>

  <fieldset>
    <legend>Pruebas</legend>
    <div class="grupo">
      <strong>Mismo dataset</strong>
      <label class="op"><input type="radio" name="metodo" value="simple" checked> Validación simple</label>
      <label class="op"><input type="radio" name="metodo" value="estratificada"> Selección aleatoria estratificada</label>
      <label class="op sub">Porcentaje de entrenamiento: <input type="number" id="pct" value="70" min="1" max="99"> %</label>
      <label class="op"><input type="radio" name="metodo" value="cruzada"> Validación cruzada (50%-50%)</label>
    </div>
    <div class="grupo">
      <label class="op"><input type="radio" name="metodo" value="externo"> Archivo de pruebas externo</label>
      <input type="file" id="externo" accept=".csv,.txt">
    </div>
  </fieldset>

  <label>Variables continuas:
    <select id="continuo">
      <option value="densidad">Función de densidad (normal)</option>
      <option value="anchos">Intervalos de anchos iguales</option>
      <option value="frecuencias">Intervalos de frecuencias iguales</option>
    </select>
  </label>
  <label>Intervalo de discretización (número de intervalos): <input type="number" id="intervalos" value="5" min="2"></label>

  <button id="analizar">Análisis</button>
  <div id="errores"></div>
</section>

<section class="panel" id="resultados" hidden>
  <h1>Clasificador Bayes Ingenuo</h1>
  <p id="info"></p>

  <div id="evaluacion">
    <h2>Matriz de confusión</h2>
    <div class="tabla" id="matriz"></div>
    <h2>Métricas de evaluación</h2>
    <div class="tabla" id="metricas"></div>
    <h2>Accuracy: <span id="accuracy"></span></h2>
  </div>

  <div id="predicciones"></div>
</section>

<script src="validacion.js"></script>
<script src="clasificador.js"></script>
<script src="evaluacion.js"></script>
<script src="app.js"></script>
</body>
</html>
